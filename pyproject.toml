[project]
name = "robodog-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.13.1",
    "numpy>=2.2.6",
    "pypdf>=6.4.0",
    "python-docx>=1.2.0",
    "supabase>=2.24.0",
]

[project.scripts]
robodog-server = "robodog_server.main:main"
test = "test_docs.main:main"

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
